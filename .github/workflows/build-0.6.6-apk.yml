name: Build XAN 0.6.6 APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-0.6.6-apk.yml'

permissions:
  contents: read

jobs:
  build_release:
    name: Build signed 0.6.6 APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing KEYSTORE repository secret." >&2; exit 1; }
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build signed release APK
        env:
          XAN_RELEASE_TAG: v0.6.6
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --console=plain --warning-mode summary -x lint -Dorg.gradle.problems.report=false

      - name: Verify signed APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#APKS[@]}." >&2
            exit 1
          fi

          APK_PATH="${APKS[0]}"
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          [ -n "$APK_SIGNER" ] || { echo "Android apksigner was not found." >&2; exit 1; }

          EXPECTED_CERT=d8534bb4f95bd7e4818580251e2fd2c8dfefa2ae21f474171d4130ccf9d0bd41
          CERT=$("$APK_SIGNER" verify --print-certs "$APK_PATH" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "Refusing artifact: signing certificate does not match the XAN update key." >&2
            exit 1
          fi

          cp "$APK_PATH" Xan-0.6.6.apk

      - name: Upload XAN 0.6.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: Xan-0.6.6
          path: Xan-0.6.6.apk
          retention-days: 14
