name: Stable Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build/create (2-4 numeric parts, e.g. v0.5.2 or v0.1.6.1)'
        required: true
        type: string
      title:
        description: 'Release title (leave blank to use the tag)'
        required: false
        default: ''
        type: string
      notes:
        description: 'Release notes/changelog (leave blank to generate notes)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build Universal GMS Stable Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve or create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$EVENT_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Invalid release tag: $TAG" >&2
            echo "Use 2-4 numeric parts, e.g. v0.5.2 or v0.1.6.1" >&2
            exit 1
          fi

          CREATED="false"
          WAS_DRAFT="false"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            WAS_DRAFT="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TITLE="$INPUT_TITLE"
            if [ -z "$TITLE" ]; then
              TITLE="$TAG"
            fi

            if [ -n "$INPUT_NOTES" ]; then
              gh release create "$TAG" \
                --repo "${{ github.repository }}" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --notes "$INPUT_NOTES" \
                --draft
            else
              gh release create "$TAG" \
                --repo "${{ github.repository }}" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --generate-notes \
                --draft
            fi

            CREATED="true"
            WAS_DRAFT="true"
          else
            echo "Published GitHub Release $TAG could not be found." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "was_draft=$WAS_DRAFT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE repository secret." >&2
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build Universal GMS Release APK
        env:
          XAN_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          mv "$APK_PATH" "xan-$TAG.apk"
          gh release upload "$TAG" "xan-$TAG.apk" --repo "${{ github.repository }}" --clobber

      - name: Publish manually-created draft release
        if: ${{ github.event_name == 'workflow_dispatch' && steps.release.outputs.was_draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
