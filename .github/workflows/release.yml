name: Stable Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build/create (2-4 numeric parts, e.g. v0.6.0)'
        required: true
        type: string
      title:
        description: 'Release title (leave blank to use the tag)'
        required: false
        default: ''
        type: string
      notes:
        description: 'Release notes/changelog (leave blank to generate notes)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build Stable Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve or create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$EVENT_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          WAS_DRAFT="false"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            WAS_DRAFT="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TITLE="$INPUT_TITLE"
            [ -n "$TITLE" ] || TITLE="$TAG"
            if [ -n "$INPUT_NOTES" ]; then
              gh release create "$TAG" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "$TITLE" --notes "$INPUT_NOTES" --draft
            else
              gh release create "$TAG" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes --draft
            fi
            WAS_DRAFT="true"
          else
            echo "Published GitHub Release $TAG could not be found." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "was_draft=$WAS_DRAFT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing KEYSTORE repository secret." >&2; exit 1; }
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build signed release APK
        env:
          XAN_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --console=plain --warning-mode summary -x lint -Dorg.gradle.problems.report=false

      - name: Verify and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#APKS[@]}." >&2
            exit 1
          fi

          APK_PATH="${APKS[0]}"
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          [ -n "$APK_SIGNER" ] || { echo "Android apksigner was not found." >&2; exit 1; }

          EXPECTED_CERT=d8534bb4f95bd7e4818580251e2fd2c8dfefa2ae21f474171d4130ccf9d0bd41
          CERT=$("$APK_SIGNER" verify --print-certs "$APK_PATH" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "Refusing to publish: signing certificate does not match the XAN update key." >&2
            exit 1
          fi

          OUTPUT="Xan-$VERSION.apk"
          cp "$APK_PATH" "$OUTPUT"
          gh release upload "$TAG" "$OUTPUT" --repo "${{ github.repository }}" --clobber

      - name: Publish manually-created draft release
        if: ${{ github.event_name == 'workflow_dispatch' && steps.release.outputs.was_draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
